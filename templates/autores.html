<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Autores</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body>
    <h1>Gestión de Autores</h1>

    <!-- Formulario POST para registrar nuevos autores -->
    <section>
        <h2>Registrar Nuevo Autor</h2>
        <form id="form-autor">
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Ej: Gabriel García Márquez" required>
            </div>
            <br>
            <div>
                <label for="nacionalidad">Nacionalidad:</label>
                <input type="text" id="nacionalidad" placeholder="Ej: Colombiana" required>
            </div>
            <br>
            <div>
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento">
            </div>
            <br>
            <button type="submit">Guardar Autor</button>
        </form>
    </section>

    <hr>

    <!-- Tabla GET para listar los autores existentes -->
    <section>
        <h2>Lista de Autores</h2>
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Nacionalidad</th>
                    <th>Fecha de Nacimiento</th>
                </tr>
            </thead>
            <tbody id="tabla-autores">
                <!-- Se poblará dinámicamente con JavaScript -->
            </tbody>
        </table>
    </section>

    <script src="/static/js/autores.js"></script>
</body>
</html>
